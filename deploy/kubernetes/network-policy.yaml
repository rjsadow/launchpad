---
# NetworkPolicy for session pod isolation (default/fallback policy)
#
# NOTE: Launchpad creates per-session NetworkPolicies dynamically based on
# each application's `allowed_hosts` configuration. This static policy serves
# as a fallback/baseline for INGRESS rules only.
#
# Egress is controlled per-session via dynamically generated NetworkPolicies:
# - Apps with allowed_hosts=[] get DNS-only egress
# - Apps with allowed_hosts=["..."] get DNS + HTTP/HTTPS egress
#
# See docs/KUBERNETES.md for Network Egress Rules documentation.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: launchpad-session-isolation
  namespace: launchpad
  labels:
    app.kubernetes.io/name: launchpad
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: session
  policyTypes:
    - Ingress
  ingress:
    # Allow incoming traffic from the launchpad server on WebSocket port
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: launchpad
              app.kubernetes.io/component: server
      ports:
        - protocol: TCP
          port: 6080  # websockify port
        - protocol: TCP
          port: 5900  # VNC port

---
# NetworkPolicy for the launchpad server
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: launchpad-server
  namespace: launchpad
  labels:
    app.kubernetes.io/name: launchpad
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: launchpad
      app.kubernetes.io/component: server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow incoming traffic from any source (ingress controller)
    - from: []
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Allow DNS lookups
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow communication with session pods
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: session
      ports:
        - protocol: TCP
          port: 6080
        - protocol: TCP
          port: 5900
    # Allow communication with Kubernetes API
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
