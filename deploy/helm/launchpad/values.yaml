# Default values for launchpad.

# Number of replicas
replicaCount: 1

image:
  repository: ghcr.io/rjsadow/launchpad
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
    # nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    # nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # nginx.ingress.kubernetes.io/websocket-services: "launchpad"
  hosts:
    - host: launchpad.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: launchpad-tls
  #    hosts:
  #      - launchpad.example.com

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Horizontal Pod Autoscaling
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Launchpad configuration
config:
  # Port for the application (internal)
  port: 8080
  # Session timeout in minutes
  sessionTimeout: 120
  # Cleanup interval in minutes
  sessionCleanupInterval: 5
  # Pod ready timeout in seconds
  podReadyTimeout: 120
  # VNC sidecar image for container sessions
  vncSidecarImage: "ghcr.io/rjsadow/launchpad-vnc-sidecar:latest"

# Branding configuration
branding:
  primaryColor: "#398D9B"
  secondaryColor: "#4AB7C3"
  tenantName: "Launchpad"
  # Optional logo URL
  logoUrl: ""

# Persistence for SQLite database
persistence:
  enabled: false
  # Use an existing PVC instead of creating one
  existingClaim: ""
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi
  annotations: {}

# Probes configuration
probes:
  liveness:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

# Network Policy
networkPolicy:
  enabled: false
  # Allow ingress from specific namespaces
  ingressNamespaces: []
  # Allow egress to specific destinations
  egressRules: []

# Pod Disruption Budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1

# RBAC for managing session pods
rbac:
  # Create RBAC resources for pod management
  create: true
  # Additional rules to add to the ClusterRole
  additionalRules: []

# Secrets management
secrets:
  # Provider: env, vault, aws, kubernetes
  provider: env
  # Vault configuration (when provider is vault)
  vault:
    addr: ""
    mountPath: "secret"
    namespace: ""
  # AWS configuration (when provider is aws)
  aws:
    region: ""
    secretPrefix: "launchpad"
  # Kubernetes configuration (when provider is kubernetes)
  kubernetes:
    secretName: ""
    secretNamespace: ""
