# Launchpad Docker Compose Configuration
# For local development and testing
#
# Usage:
#   docker compose up        - Start Launchpad
#   docker compose up -d     - Start in background
#   docker compose down      - Stop and remove containers
#   docker compose logs -f   - Follow logs
#
# Build locally:
#   docker compose build
#   docker compose up --build

services:
  launchpad:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/rjsadow/launchpad:latest
    container_name: launchpad
    ports:
      - "${LAUNCHPAD_PORT:-8080}:8080"
    environment:
      - LAUNCHPAD_PORT=8080
      - LAUNCHPAD_DB=/data/launchpad.db
      - LAUNCHPAD_CONFIG=/config/branding.json
      - LAUNCHPAD_PRIMARY_COLOR=${LAUNCHPAD_PRIMARY_COLOR:-#398D9B}
      - LAUNCHPAD_SECONDARY_COLOR=${LAUNCHPAD_SECONDARY_COLOR:-#4AB7C3}
      - LAUNCHPAD_TENANT_NAME=${LAUNCHPAD_TENANT_NAME:-Launchpad}
      - LAUNCHPAD_SESSION_TIMEOUT=${LAUNCHPAD_SESSION_TIMEOUT:-120}
      - LAUNCHPAD_SESSION_CLEANUP_INTERVAL=${LAUNCHPAD_SESSION_CLEANUP_INTERVAL:-5}
    volumes:
      - launchpad-data:/data
      - ./examples:/config:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/config"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    user: "65534:65534"

volumes:
  launchpad-data:
    driver: local
